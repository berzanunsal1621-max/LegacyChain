<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyChain | Complete Oracle Integration</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { blue: '#0500FF', dark: '#0B0E11', panel: '#15191F' } } } } }</script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s
        }

        .glass-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px)
        }

        .oracle-dot {
            position: relative;
            width: 12px;
            height: 12px
        }

        .oracle-dot::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #10B981;
            opacity: 0.7;
            animation: ping 2s infinite
        }

        .oracle-dot::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            top: 3px;
            left: 3px
        }

        .oracle-dot.danger::before,
        .oracle-dot.danger::after {
            background: #EF4444
        }

        @keyframes ping {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7
            }

            50% {
                transform: scale(1.5);
                opacity: 0
            }
        }
    </style>
</head>

<body class="bg-white dark:bg-brand-dark text-gray-900 dark:text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const CONTRACT_ADDRESS = "0x722475D187f51E04091F11302b964A1Fc5230296";
        const CONTRACT_ABI = ["function ping() external", "function simulateOracleSignal() external", "function claimInheritance() external", "function emergencyWithdraw() external", "function timeLeft() view returns(uint256)", "function currentBalance() view returns(uint256)", "function owner() view returns(address)", "function heir() view returns(address)", "event Pulse(uint256 timestamp)", "event OracleSignalReceived(string message,uint256 timestamp)", "event AssetsTransferred(address recipient,uint256 amount)"];

        const Shield = p => <svg {...p} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>;
        const Activity = p => <svg {...p} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>;
        const Clock = p => <svg {...p} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>;
        const Heart = p => <svg {...p} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>;
        const AlertTriangle = p => <svg {...p} width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>;
        const LogOut = p => <svg {...p} width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>;

        const Dashboard = ({ walletAddress, onDisconnect, signer }) => {
            const [timeLeft, setTimeLeft] = useState(300);
            const [isDead, setIsDead] = useState(false);
            const [balance, setBalance] = useState("10.45");
            const [heartRate, setHeartRate] = useState(72);
            const [logs, setLogs] = useState([]);
            const addLog = msg => setLogs(p => [...p, `[${new Date().toLocaleTimeString()}] ${msg}`]);

            useEffect(() => { if (!signer) return; const c = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer); c.on("OracleSignalReceived", (m, t) => { addLog(`🚨 ORACLE: ${m}`); setIsDead(true); setTimeLeft(0); setBalance("0.00") }); c.on("AssetsTransferred", (r, a) => { addLog(`💸 TRANSFER: ${ethers.utils.formatEther(a)} ETH`); setBalance("0.00") }); return () => c.removeAllListeners() }, [signer]);

            useEffect(() => { if (!signer) return; const poll = async () => { try { const c = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer); const r = (await c.timeLeft()).toNumber(); if (r === 0 && !isDead) { setIsDead(true); addLog("⚰️ Expired/Oracle") } setTimeLeft(r) } catch (e) { } }; const i = setInterval(poll, 2000); return () => clearInterval(i) }, [signer, isDead]);

            useEffect(() => { if (timeLeft > 0) { const t = setTimeout(() => { setTimeLeft(timeLeft - 1); setHeartRate(70 + Math.floor(Math.random() * 15)) }, 1000); return () => clearTimeout(t) } }, [timeLeft]);

            const formatTime = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60; return `${d}d ${h}h ${m}m ${sec}s` };
            const ping = async () => { try { const c = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer); const tx = await c.ping({ gasLimit: 500000 }); addLog("⏳ Ping..."); await tx.wait(); addLog("✅ Confirmed!"); setTimeLeft(300); setIsDead(false) } catch (e) { alert("Error: " + e.message) } };
            const emergency = async () => { try { const c = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer); const tx = await c.emergencyWithdraw({ gasLimit: 500000 }); addLog("🚨 Emergency..."); await tx.wait(); addLog("✅ Withdrawn"); setBalance("0.00") } catch (e) { alert("Error: " + e.message) } };

            return (<div className="min-h-screen bg-gray-50 dark:bg-brand-dark">
                <div className="bg-white dark:bg-brand-panel border-b border-gray-200 dark:border-gray-800 px-6 py-4 sticky top-0 z-30">
                    <div className="max-w-7xl mx-auto flex justify-between items-center">
                        <div className="flex items-center gap-3"><div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white"><Shield width="20" height="20" /></div><span className="text-xl font-bold">LegacyChain</span></div>
                        <div className="flex items-center gap-4">
                            <div className={`px-3 py-1.5 rounded-full text-xs font-bold ${isDead ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>{isDead ? 'PROTOCOL ACTIVE' : 'ONLINE'}</div>
                            <div className="bg-gray-100 dark:bg-gray-800 px-4 py-2 rounded-lg font-mono text-sm">{walletAddress.substring(0, 6)}...{walletAddress.substring(38)}</div>
                            <button onClick={onDisconnect} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg"><LogOut /></button>
                        </div>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto p-6 space-y-6">
                    <div className={`rounded-3xl p-8 text-white shadow-xl transition-all ${isDead ? 'bg-gradient-to-r from-red-600 to-red-900' : 'bg-gradient-to-r from-blue-600 to-indigo-600'}`}>
                        <div className="flex justify-between items-center">
                            <div><div className="flex items-center gap-2 mb-2 text-blue-100"><Clock width="18" height="18" /><span className="text-xs uppercase">Proof of Life</span></div><h2 className="text-5xl font-bold font-mono">{formatTime(timeLeft)}</h2><p className="mt-2 text-blue-100">{isDead ? "Assets Transferred" : "Send Ping to reset"}</p></div>
                            {!isDead && <button onClick={ping} className="bg-white text-blue-600 px-6 py-3 rounded-xl font-bold hover:bg-blue-50"><Activity width="20" height="20" className="inline mr-2" />Ping</button>}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className={`p-4 rounded-xl border ${isDead ? 'bg-red-50 dark:bg-red-900/10 border-red-200' : 'bg-white dark:bg-brand-panel border-gray-200 dark:border-gray-800'}`}>
                            <div className="flex items-center gap-3"><Heart className={isDead ? 'text-red-500' : 'text-green-500'} /><div><div className="text-xs text-gray-500">HealthKit</div><div className="font-bold">{isDead ? "NO SIGNAL" : `${heartRate} BPM`}</div></div></div>
                            <div className="mt-2 flex items-center gap-2"><div className={`oracle-dot ${isDead ? 'danger' : ''}`}></div><span className="text-xs font-bold">{isDead ? 'ALERT' : 'ACTIVE'}</span></div>
                        </div>
                        <div className="bg-white dark:bg-brand-panel p-4 rounded-xl border border-gray-200 dark:border-gray-800"><div className="text-xs text-gray-500">Balance</div><div className="text-2xl font-bold">{balance} ETH</div></div>
                        <div className="bg-white dark:bg-brand-panel p-4 rounded-xl border border-gray-200 dark:border-gray-800"><div className="text-xs text-gray-500">Status</div><div className={`font-bold ${isDead ? 'text-red-500' : 'text-green-500'}`}>{isDead ? 'TRANSFERRED' : 'ACTIVE'}</div></div>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button onClick={ping} disabled={isDead} className={`p-4 rounded-xl h-32 flex flex-col justify-between ${isDead ? 'bg-gray-100 opacity-50 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}><div className="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><Activity width={18} height={18} /></div><div><div className="font-bold">Ping</div><div className="text-xs opacity-80">Reset Timer</div></div></button>
                        <button onClick={emergency} className="p-4 bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-xl hover:bg-red-100 h-32 flex flex-col justify-between"><div className="w-8 h-8 bg-red-100 text-red-600 rounded-lg flex items-center justify-center"><AlertTriangle width={18} height={18} /></div><div><div className="font-bold text-red-700">Emergency</div><div className="text-xs text-red-500">Cancel Protocol</div></div></button>
                    </div>
                    <div className="bg-white dark:bg-brand-panel border border-gray-200 dark:border-gray-800 rounded-2xl p-6"><h3 className="font-bold mb-4">📡 Event Logs (Real-time)</h3><div className="space-y-1 text-sm font-mono max-h-64 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-4 rounded-lg">{logs.length === 0 ? <div className="text-gray-400">No events yet...</div> : logs.map((l, i) => <div key={i} className="text-gray-700 dark:text-gray-300">{l}</div>)}</div></div>
                    <div className="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-900/30 p-4 rounded-lg"><p className="font-bold text-yellow-800 dark:text-yellow-400">🧪 Test Oracle Simulation:</p><p className="text-sm text-yellow-700 dark:text-yellow-500">Go to Remix → Call <code className="bg-yellow-200 dark:bg-yellow-900 px-2 py-1 rounded">simulateOracleSignal()</code> → This page detects it instantly!</p></div>
                </div>
            </div>)
        };

        const App = () => {
            const [isConnected, setIsConnected] = useState(false);
            const [walletAddress, setWalletAddress] = useState("");
            const [signer, setSigner] = useState(null);
            const [darkMode, setDarkMode] = useState(true);

            useEffect(() => { darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark') }, [darkMode]);

            const connect = async () => { if (!window.ethereum) { alert("Install MetaMask!"); return } try { const p = new ethers.providers.Web3Provider(window.ethereum); await p.send("eth_requestAccounts", []); const s = p.getSigner(); const a = await s.getAddress(); setSigner(s); setWalletAddress(a); setIsConnected(true) } catch (e) { console.error(e) } };
            const disconnect = () => { setIsConnected(false); setWalletAddress(""); setSigner(null) };

            if (isConnected) return <Dashboard walletAddress={walletAddress} onDisconnect={disconnect} signer={signer} />;

            return (<div className="min-h-screen bg-white dark:bg-brand-dark flex items-center justify-center"><div className="text-center"><Shield className="w-16 h-16 mx-auto mb-4 text-blue-600" /><h1 className="text-5xl font-bold mb-2 text-gray-900 dark:text-white">LegacyChain</h1><p className="text-gray-500 dark:text-gray-400 mb-6">Decentralized Inheritance Protocol</p><button onClick={connect} className="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-lg">Connect Wallet</button></div></div>)
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
