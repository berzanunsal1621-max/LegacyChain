        const Dashboard = ({ walletAddress, onDisconnect, openModal, signer, toggleTheme, darkMode, translate, currentLang, switchLanguage, setModal, setModalInputValue }) => {

            // --- live vault state ---
            const [timeLeft, setTimeLeft] = useState(300);
            const [totalTimeLimit, setTotalTimeLimit] = useState(300);
            const [isTransferred, setIsTransferred] = useState(false);
            const [balance, setBalance] = useState("0.00");
            const [recentActivity, setRecentActivity] = useState([]);
            const [riskEngine, setRiskEngine] = useState({
                safetyScore: 100,
                status: "LOW",
                action: "Keep regular proof-of-life pings active.",

            });
            const [lastTxHash, setLastTxHash] = useState(null);

            // NEW: Multi-Heir State
            const [heirs, setHeirs] = useState([]);
            const [showHeirPanel, setShowHeirPanel] = useState(false);

            // NEW: ETH/USD Price State
            const [ethPrice, setEthPrice] = useState(3245.67);
            const [priceChange, setPriceChange] = useState(2.34);

            // NEW: Oracle Activity Log
            const [oracleLog, setOracleLog] = useState([
                { time: "--:--:--", source: "Registry", event: "Awaiting authority attestations", status: "READY" }
            ]);
            const [oracleSystemStatus, setOracleSystemStatus] = useState({
                authorities: [],
                configuredAuthorityRoles: [],
                notificationSubscribers: 0,
                totalCases: 0
            });

            // NEW: QR Code State
            const [showQR, setShowQR] = useState(false);

            // NEW: Oracle & Grace Period State
            const [oracleSignatures, setOracleSignatures] = useState(0);
            const [isGracePeriod, setIsGracePeriod] = useState(false);
            const [graceTimeLeft, setGraceTimeLeft] = useState(0);
            const [isDeathConfirmed, setIsDeathConfirmed] = useState(false);
            const [oracleCase, setOracleCase] = useState({ caseId: null, status: "NONE", openedAt: null, source: "idle" });
            const [oracleCategories, setOracleCategories] = useState({ government: false, health: false, legal: false });
            const [oracleConsensusReady, setOracleConsensusReady] = useState(false);

            // NEW: View State (Dashboard vs Profile)
            const [currentView, setCurrentView] = useState('dashboard');

            // Record activity (Ghost Ping) whenever the user interacts
            const recordActivity = async () => {
                if (!signer) return;
                try {
                    const activeContract = getActiveContract();
                    if (!activeContract.isAdvanced) return;
                    const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                    const tx = await contract.recordActivity();
                    console.log("ğŸ‘» Activity Recorded (Ghost Ping):", tx.hash);
                    setLastTxHash(tx.hash);
                } catch (e) {
                    console.log("Activity recording failed (expected if not owner or no change):", e.message);
                }
            };

            // Load heirs from blockchain
            useEffect(() => {
                if (!signer) return;
                const loadHeirs = async () => {
                    try {
                        const activeContract = getActiveContract();
                        if (!activeContract.isAdvanced) return;
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        const heirData = await contract.getAllHeirs();
                        const formatted = heirData.map((h, index) => ({
                            index,
                            wallet: h.wallet.slice(0, 6) + '...' + h.wallet.slice(-4),
                            fullWallet: h.wallet,
                            percentage: Number(h.percentage),
                            name: h.name,
                            isActive: h.isActive
                        }));
                        setHeirs(formatted);
                        console.log('âœ… Blockchain\'den heirs yÃ¼klendi:', formatted);
                    } catch (err) {
                        console.error('âŒ Heirs yÃ¼klenemedi:', err.message);
                    }
                };
                loadHeirs();
                const interval = setInterval(loadHeirs, 30000);
                return () => clearInterval(interval);
            }, [signer]);

            useEffect(() => {
                if (!walletAddress) return;

                let isMounted = true;
                const loadCaseState = async () => {
                    try {
                        const response = await fetch(`${ORACLE_BACKEND_URL}/api/check-death/${walletAddress}`);
                        const result = await response.json();
                        if (!response.ok || !isMounted) return;

                        setOracleCase({
                            caseId: result.caseId || result.storedCase?.caseId || null,
                            status: result.caseStatus || "NONE",
                            openedAt: result.storedCase?.openedAt || null,
                            source: result.storedCase ? "backend" : "chain"
                        });
                        setOracleCategories(result.categoriesSeen || { government: false, health: false, legal: false });
                        setOracleConsensusReady(Boolean(result.consensusReady));
                    } catch (_) {
                        if (!isMounted) return;
                    }
                };

                loadCaseState();
                const interval = setInterval(loadCaseState, 10000);
                return () => {
                    isMounted = false;
                    clearInterval(interval);
                };
            }, [walletAddress]);

            useEffect(() => {
                let isMounted = true;

                const loadOracleStatus = async () => {
                    try {
                        const response = await fetch(`${ORACLE_BACKEND_URL}/api/status`);
                        const result = await response.json();
                        if (!response.ok || !isMounted) return;

                        setOracleSystemStatus({
                            authorities: result.authorities || [],
                            configuredAuthorityRoles: result.configuredAuthorityRoles || [],
                            notificationSubscribers: result.notificationSubscribers || 0,
                            totalCases: result.totalCases || 0
                        });

                        if (Array.isArray(result.signalLog) && result.signalLog.length > 0) {
                            setOracleLog(result.signalLog.slice().reverse().map((entry) => ({
                                time: new Date(entry.timestamp).toLocaleTimeString(),
                                source: entry.role || entry.authority || "Authority",
                                event: entry.signatureMode === "EIP712"
                                    ? `Signed attestation ${entry.metadataHash?.slice(0, 10) || ""}`
                                    : `Attestation ${entry.metadataHash?.slice(0, 10) || ""}`,
                                status: entry.caseStatus || (entry.isConfirmed ? "ATTESTED" : "RECORDED")
                            })));
                        }
                    } catch (_) {
                        if (!isMounted) return;
                    }
                };

                loadOracleStatus();
                const interval = setInterval(loadOracleStatus, 12000);
                return () => {
                    isMounted = false;
                    clearInterval(interval);
                };
            }, []);

            // ETH/USD price with CoinGecko fallback
            useEffect(() => {
                let isMounted = true;
                const applyLocalPriceFallback = () => {
                    setEthPrice((prev) => prev || 3200);
                    setPriceChange(0);
                };
                const loadEthPrice = async () => {
                    try {
                        const response = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd&include_24hr_change=true");
                        if (!response.ok) throw new Error("CoinGecko unavailable");
                        const data = await response.json();
                        if (!isMounted || !data.ethereum) return;
                        setEthPrice(data.ethereum.usd);
                        setPriceChange(data.ethereum.usd_24h_change || 0);
                    } catch (err) {
                        applyLocalPriceFallback();
                    }
                };
                loadEthPrice();
                const priceInterval = setInterval(loadEthPrice, 60000);
                return () => {
                    isMounted = false;
                    clearInterval(priceInterval);
                };
            }, []);

            // Etherscan link function
            const openEtherscan = (txHash) => {
                if (txHash) {
                    window.open(`https://sepolia.etherscan.io/tx/${txHash}`, '_blank');
                } else {
                    const activeContract = getActiveContract();
                    window.open(`https://sepolia.etherscan.io/address/${activeContract.address}`, '_blank');
                }
            };

            // Read initial timeLeft + balance from blockchain
            useEffect(() => {
                if (!signer) return;

                const loadInitialData = async () => {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);

                        // Read timeLeft
                        const t = await contract.timeLeft();
                        const remaining = Number(t.toString());
                        console.log("ğŸ“¡ Blockchain'den okunan timeLeft:", remaining);

                        if (activeContract.isAdvanced && typeof contract.timeLimit === "function") {
                            const totalLimit = await contract.timeLimit();
                            setTotalTimeLimit(Number(totalLimit.toString()));
                        }

                        // Read balance
                        const bal = await contract.currentBalance();
                        const balEth = ethers.utils.formatEther(bal);
                        setBalance(parseFloat(balEth).toFixed(4));
                        console.log("ğŸ’° Contract balance:", balEth, "ETH");

                        if (remaining > 0) {
                            setTimeLeft(remaining);
                            setIsTransferred(false);
                        } else {
                            if (Number(bal.toString()) > 0) {
                                setTimeLeft(0);
                                setIsTransferred(false);
                            } else {
                                setTimeLeft(0);
                                setIsTransferred(true);
                            }
                        }
                    } catch (err) {
                        console.error("âŒ Blockchain veri okunamadÄ±:", err.message);
                    }
                };

                loadInitialData();
                // Poll balance every 10 seconds
                const balInterval = setInterval(async () => {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        const bal = await contract.currentBalance();
                        setBalance(parseFloat(ethers.utils.formatEther(bal)).toFixed(4));
                    } catch (e) { }
                }, 10000);
                return () => clearInterval(balInterval);
            }, [signer]);

            useEffect(() => {
                const total = Math.max(totalTimeLimit || 1, 1);
                const remainingRatio = Math.max(0, Math.min(1, timeLeft / total));
                let riskScore = Math.round((1 - remainingRatio) * 30);
                riskScore += Math.min(oracleSignatures, 3) * 18;
                if (isGracePeriod) riskScore += 25;
                if (parseFloat(balance || "0") > 0) riskScore += 7;
                if (heirs.filter((heir) => heir.isActive !== false).length === 0) riskScore += 10;
                if (recentActivity.length === 0) riskScore += 4;
                riskScore = Math.max(0, Math.min(100, riskScore));
                const safetyScore = 100 - riskScore;
                const status = riskScore >= 75 ? "CRITICAL" : riskScore >= 50 ? "HIGH" : riskScore >= 25 ? "WATCH" : "LOW";
                const action = isGracePeriod
                    ? "Review oracle evidence and cancel the grace period if the owner is active."
                    : oracleSignatures > 0
                        ? "Check registry attestations and authority roles."
                        : remainingRatio < 0.25
                            ? "Send a proof-of-life ping."
                            : "Keep regular proof-of-life pings active.";
                const explanation = `${Math.round(remainingRatio * 100)}% timer remaining, ${oracleSignatures} signal(s), ${heirs.filter((heir) => heir.isActive !== false).length} active heir(s).`;
                setRiskEngine({ safetyScore, status, action, explanation });
            }, [timeLeft, totalTimeLimit, oracleSignatures, isGracePeriod, balance, heirs, recentActivity]);

            // LANGUAGE STATE
            const [language, setLanguage] = useState('en');

            const t = (key) => {
                const keys = key.split('.');
                let val = TRANSLATIONS[language];
                for (const k of keys) {
                    val = val ? val[k] : null;
                }
                return val || key;
            };

            const toggleLanguage = () => {
                setLanguage(prev => prev === 'en' ? 'tr' : 'en');
            };

            // --- ORACLE EVENT MONITOR ---
            useEffect(() => {
                if (!signer) {
                    console.log("âš ï¸ Signer yok, Oracle monitor baÅŸlatÄ±lamÄ±yor");
                    return;
                }

                console.log("ğŸš€ Oracle monitor baÅŸlatÄ±lÄ±yor...");

                let intervalId;
                let isMounted = true;

                const startMonitoring = async () => {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);

                        intervalId = setInterval(async () => {
                            if (!isMounted) return;

                            try {
                                const t = await contract.timeLeft();
                                setTimeLeft(Number(t.toString()));

                                if (activeContract.isAdvanced) {
                                    // 1. Check Oracle Consensus
                                    const oracleAddr = await contract.decentralizedOracle();
                                    if (oracleAddr !== ethers.constants.AddressZero) {
                                        const oracleContract = new ethers.Contract(oracleAddr, ORACLE_ABI, signer);
                                        const sigs = await oracleContract.signalCount(walletAddress);
                                        setOracleSignatures(Number(sigs));
                                    }

                                    // 2. Check Grace Period
                                    const confirmedTime = await contract.deathConfirmedTime();
                                    if (Number(confirmedTime) > 0) {
                                        const graceSecs = await contract.GRACE_PERIOD();
                                        const now = Math.floor(Date.now() / 1000);
                                        const elapsed = now - Number(confirmedTime);
                                        const totalGrace = Number(graceSecs);

                                        if (elapsed < totalGrace) {
                                            setIsGracePeriod(true);
                                            setGraceTimeLeft(totalGrace - elapsed);
                                        } else {
                                            setIsGracePeriod(false);
                                        }
                                    } else {
                                        setIsGracePeriod(false);
                                    }
                                }
                            } catch (err) {
                                console.log("Monitor silent error:", err.message);
                            }
                        }, 5000);
                    } catch (err) { console.error(err); }
                };

                startMonitoring();

                // CLEANING
                return () => {
                    isMounted = false;
                    if (intervalId) clearInterval(intervalId);
                    console.log("ğŸ›‘ Oracle monitor durduruldu");
                };
            }, [signer]); // Executes only when the signer is updated.
            // --- END ORACLE MONITOR ---



            useEffect(() => {
                if (timeLeft > 0) {
                    const timer = setTimeout(() => {
                        setTimeLeft(timeLeft - 1);
                    }, 1000);
                    return () => clearTimeout(timer);
                } else if (timeLeft === 0 && !isTransferred) {
                    // Sadece modal gÃ¶ster, isTransferred'i true yapma ki buton gÃ¶zÃ¼ksÃ¼n
                    openModal("PROTOCOL ALERT", "Timer Expired! Inheritance can now be claimed by the beneficiary.");
                }
            }, [timeLeft, isTransferred]);

            const formatTime = (seconds) => {
                const d = Math.floor(seconds / (3600 * 24));
                const h = Math.floor((seconds % (3600 * 24)) / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${d}d ${h}h ${m}m ${s}s`;
            };

            const resetTimer = async () => {
                // REAL BLOCKCHAIN MODE
                const activeContract = getActiveContract();
                if (activeContract.address && signer) {
                    try {
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        openModal(translate('modal.processing'), translate('modal.ping_sent'));
                        const tx = await contract.ping();
                        await tx.wait();
                        openModal(translate('modal.success'), translate('modal.ping_confirmed'));
                        const timeVal = await contract.timeLeft();
                        setTimeLeft(Number(timeVal.toString()));
                        setIsTransferred(false);
                        setRecentActivity(prev => [{ type: 'Ping', amount: '-', date: 'Just now', status: 'Success', hash: tx.hash.slice(0, 6) + '...' + tx.hash.slice(-4) }, ...prev].slice(0, 10));
                    } catch (err) {
                        console.error(err);
                        openModal(translate('modal.error'), "Transaction failed: " + err.message);
                    }
                }
                else {
                    openModal(translate('modal.error'), "Connect a wallet and select a vault before sending a proof-of-life ping.");
                }
            }
            const handleEmergencyWithdraw = async () => {
                if (signer) {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        openModal(translate('modal.processing'), translate('modal.withdraw_progress'));
                        const tx = await contract.emergencyWithdraw();
                        await tx.wait();
                        openModal(translate('modal.success'), translate('modal.withdraw_complete'));

                        // Refresh balance
                        const bal = await contract.currentBalance();
                        setBalance(ethers.utils.formatEther(bal));

                        setRecentActivity(prev => [{ type: 'Emergency Withdrawal', amount: '-', date: 'Just now', status: 'Success', hash: tx.hash.slice(0, 6) + '...' + tx.hash.slice(-4) }, ...prev].slice(0, 10));
                    } catch (err) {
                        console.error(err);
                        openModal(translate('modal.error'), translate('modal.withdraw_failed') + ": " + err.message);
                    }
                } else {
                    openModal(translate('modal.error'), "Connect a wallet and select a vault before emergency withdrawal.");
                }
            };

            const handleDeposit = async (amount) => {
                if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
                    openModal(translate('modal.error'), "Invalid amount.");
                    return;
                }

                if (signer) {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        openModal(translate('modal.processing'), translate('modal.ping_sent'));

                        const tx = await signer.sendTransaction({
                            to: activeContract.address,
                            value: ethers.utils.parseEther(amount)
                        });
                        await tx.wait();

                        openModal(translate('modal.success'), translate('modal.deposit_success'));

                        // Refresh balance
                        const bal = await contract.currentBalance();
                        setBalance(ethers.utils.formatEther(bal));

                        setRecentActivity(prev => [{ type: 'Deposit', amount: amount + ' ETH', date: 'Just now', status: 'Success', hash: tx.hash.slice(0, 6) + '...' + tx.hash.slice(-4) }, ...prev].slice(0, 10));
                    } catch (err) {
                        console.error(err);
                        const cleanError = err.message.length > 200 ? err.message.substring(0, 200) + "..." : err.message;
                        openModal(translate('modal.error'), translate('modal.deposit_failed') + ": " + cleanError);
                    }
                } else {
                    openModal(translate('modal.error'), "Connect a wallet and select a vault before depositing ETH.");
                }
            };

            const handleClaim = async () => {
                if (signer) {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        openModal(translate('modal.processing'), "Initiating inheritance claim on blockchain...");
                        const tx = await contract.claimInheritance();
                        await tx.wait();
                        openModal(translate('modal.success'), "Inheritance claimed! Assets have been distributed to heirs.");

                        // Refresh balance
                        const bal = await contract.currentBalance();
                        setBalance(ethers.utils.formatEther(bal));
                        setIsTransferred(true);

                        setRecentActivity(prev => [{ type: 'Inh. Claim', amount: '-', date: 'Just now', status: 'Success', hash: tx.hash.slice(0, 6) + '...' + tx.hash.slice(-4) }, ...prev].slice(0, 10));
                    } catch (err) {
                        console.error(err);
                        const cleanError = err.message.length > 200 ? err.message.substring(0, 200) + "..." : err.message;
                        openModal(translate('modal.error'), "Claim failed: " + cleanError);
                    }
                }
            };

            const handleOracleTrigger = async () => {
                if (signer) {
                    try {
                        const activeContract = getActiveContract();
                        openModal(translate('modal.processing'), translate('modal.oracle_progress'));
                        const response = await fetch(`${ORACLE_BACKEND_URL}/api/death-signal`, {
                            method: "POST",
                            headers: backendHeaders(),
                            body: JSON.stringify({
                                userAddress: walletAddress,
                                authorityRole: "government",
                                sourceType: "GOVERNMENT_REGISTRY",
                                metadata: {
                                    vault: activeContract.address,
                                    requestedBy: walletAddress,
                                    note: "Frontend authority attestation request"
                                }
                            })
                        });
                        const result = await response.json();
                        if (!response.ok) throw new Error(result.error || "Oracle backend rejected the signal.");
                        openModal(translate('modal.success'), `Authority signal submitted. Tx: ${result.txHash || "pending"}`);
                        setOracleCase({
                            caseId: result.caseId || result.onChainCase?.caseId || null,
                            status: result.caseStatus || result.onChainCase?.status || (result.isConfirmed ? "ATTESTED" : "CASE_OPEN"),
                            openedAt: new Date().toISOString(),
                            source: result.signatureMode === "EIP712" ? "signed-relay" : "backend"
                        });
                        setOracleCategories(result.categoriesSeen || { government: false, health: false, legal: false });
                        setOracleConsensusReady(Boolean(result.consensusReady));

                        // Explicitly refresh signatures as well
                        if (activeContract.isAdvanced) {
                            const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                            const oracleAddr = await contract.decentralizedOracle();
                            const oracleContract = new ethers.Contract(oracleAddr, ORACLE_ABI, signer);
                            const sigs = await oracleContract.signalCount(walletAddress);
                            setOracleSignatures(Number(sigs));
                            setOracleLog(prev => [{
                                time: new Date().toLocaleTimeString(),
                                source: "Government",
                                event: `Metadata hash ${result.metadataHash || "recorded"}`,
                                status: result.signatureMode === "EIP712" ? "SIGNED" : "SUBMITTED"
                            }, ...prev].slice(0, 10));
                        }
                    } catch (err) {
                        console.error(err);
                        const cleanError = err.message.length > 200 ? err.message.substring(0, 200) + "..." : err.message;
                        openModal(translate('modal.error'), "Oracle signal failed: " + cleanError);
                    }
                } else {
                    openModal(translate('modal.error'), "Connect a wallet before submitting an oracle signal.");
                }
            };

            const handleStartGracePeriod = async () => {
                if (signer) {
                    try {
                        const activeContract = getActiveContract();
                        const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                        openModal(translate('modal.processing'), "Starting safety grace period...");
                        const tx = await contract.startGracePeriod();
                        await tx.wait();
                        setOracleCase((prev) => ({ ...prev, status: "GRACE_ACTIVE" }));
                        openModal(translate('modal.success'), "Grace period started. Security timer is now running.");
                    } catch (err) {
                        console.error(err);
                        openModal(translate('modal.error'), "Failed to start grace period: " + err.message);
                    }
                }
            };

            const handleOpenDispute = async () => {
                if (!oracleCase.caseId) {
                    openModal("Error", "There is no active oracle case to dispute.");
                    return;
                }

                try {
                    openModal("Processing", "Opening dispute review...");
                    const response = await fetch(`${ORACLE_BACKEND_URL}/api/cases/${oracleCase.caseId}/dispute`, {
                        method: "POST",
                        headers: backendHeaders(),
                        body: JSON.stringify({
                            authorityRole: "legal",
                            disputeReason: "owner_dispute_request"
                        })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || "Failed to open dispute.");
                    setOracleCase((prev) => ({ ...prev, status: "DISPUTED", source: "backend" }));
                    setOracleConsensusReady(false);
                    setOracleLog(prev => [{
                        time: new Date().toLocaleTimeString(),
                        source: "Dispute",
                        event: "Case moved to dispute review",
                        status: "DISPUTED"
                    }, ...prev].slice(0, 10));
                    openModal("Success", "Dispute opened. The case now requires review before claims can proceed.");
                } catch (err) {
                    console.error(err);
                    openModal("Error", "Dispute request failed: " + err.message);
                }
            };

            const primaryHeir = heirs.find((heir) => heir.isActive !== false);

            const handleInitiatePrimaryHeirUpdate = () => {
                if (!signer) {
                    openModal(translate('modal.error'), "Connect a wallet before updating a heir.");
                    return;
                }
                if (!primaryHeir) {
                    openModal(translate('modal.error'), "Add an active heir before requesting an update.");
                    return;
                }

                setModalInputValue("");
                setModal({
                    isOpen: true,
                    title: "Queue Heir Update",
                    content: `Enter the replacement wallet for ${primaryHeir.name || "the primary heir"}:`,
                    needsInput: true,
                    confirmAction: async (val) => {
                        if (!val || !ethers.utils.isAddress(val.trim())) {
                            openModal("Error", "Enter a valid Ethereum address.");
                            return;
                        }
                        try {
                            const activeContract = getActiveContract();
                            const contract = new ethers.Contract(activeContract.address, activeContract.abi, signer);
                            openModal("Processing", "Submitting timelocked heir update...");
                            const tx = await contract.initiateHeirUpdate(
                                primaryHeir.index,
                                val.trim(),
                                primaryHeir.percentage,
                                primaryHeir.name || "Primary Heir"
                            );
                            await tx.wait();
                            closeModal();
