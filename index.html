                }
                return val || key;
            };

            const [provider, setProvider] = useState(null);
            const [signer, setSigner] = useState(null);

            // PERSISTENCE EFFECT
            useEffect(() => {
                const checkConnection = async () => {
                    if (window.ethereum && localStorage.getItem('isWalletConnected') === 'true') {
                        try {
                            const tempProvider = new ethers.providers.Web3Provider(window.ethereum);
                            const accounts = await tempProvider.listAccounts();
                            if (accounts.length > 0) {
                                const tempSigner = tempProvider.getSigner();
                                setProvider(tempProvider);
                                setSigner(tempSigner);
                                setWalletAddress(accounts[0]);
                                setIsConnected(true);
                                setDarkMode(true);
                            }
                        } catch (err) {
                            console.error("Persistence check failed:", err);
                        }
                    }
                };

                checkConnection(); // Silent auto-login for authorized users (Standard DApp behavior)

                if (window.ethereum) {
                    window.ethereum.on('accountsChanged', (accounts) => {
                        if (accounts.length > 0) {
                            setWalletAddress(accounts[0]);
                            setIsConnected(true);
                        } else {
                            disconnect();
                        }
                    });

                    window.ethereum.on('chainChanged', () => {
                        window.location.reload();
                    });
                }

                return () => {

                        window.ethereum.removeListener('accountsChanged', () => { });
                        window.ethereum.removeListener('chainChanged', () => { });
                    }
                };

                    return;
                }

                setIsConnecting(true);

                try {
                    // Standard DApp flow: Request accounts (Will popup if not authorized, silent if already authorized)
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });

                    if (accounts.length > 0) {
                        const tempProvider = new ethers.providers.Web3Provider(window.ethereum);
                        const tempSigner = tempProvider.getSigner();
                        const address = accounts[0];

                        setProvider(tempProvider);
                        setSigner(tempSigner);
                        setWalletAddress(address);
                        setIsConnected(true);
                        setDarkMode(true);
                        localStorage.setItem('isWalletConnected', 'true');
                    }

                } catch (error) {
                    console.error("Connect failed:", error);
                    if (error.code === 4001) {
                        openModal("Connection Cancelled", "User rejected the connection request.");
                    } else {
                        openModal("Connection Error", "Failed to connect to MetaMask: " + (error.message || "Unknown error"));
